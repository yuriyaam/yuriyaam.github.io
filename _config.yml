    - layout: left
      title: SOR 정정 시 매수미체결금액 오류
      sub_title: RMS · 2026.07
      quote: >
        SOR 정정 과정에서 발생한 매수미체결금액 음수 누적 오류를 해결하여 <mark>금융 거래 데이터 정합성 개선</mark>
      description: |
        - **원인:** 거래소 변경 SOR 정정으로 파생된 신규 매수주문의 미체결금액 설정 누락
        - **해결:** 실시간 주문 데이터의 SOR 처리 구분값을 활용하여 파생 신규주문 식별 및 미체결금액 설정 로직 보완

    - layout: left
      title: 푸시 대량 발송 시 DB 커넥션 풀 고갈
      sub_title: AI 시그널프로 · 2026.03
      quote: >
        대량 푸시 발송 시 발생한 DB 커넥션 풀 고갈과 스레드 누적 문제를 해결하여 <mark>발송 처리 안정성 개선</mark>
      description: |
        - **원인:** 동시 실행 스레드 100개로 인한 DB 커넥션 풀 고갈 및 ExecutorService 미종료에 따른 스레드 누적
        - **해결:** 스레드 수 100개 → 5개 조정 및 finally 블록에서 스레드 풀 종료 보장

