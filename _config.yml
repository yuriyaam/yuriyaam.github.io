about_content: | # this will include new lines to allow paragraphs
  Java와 C 기반의 6년 차 백엔드 개발자로, 금융·통신 분야의 시스템 개발 및 운영 경험을 보유하고 있습니다.

  약 5천 계좌 규모의 주식담보대출 위험관리 시스템(RMS) <mark>메인 개발자</mark>로서 실시간 거래 처리와 금융기관 연계 시스템을 담당했습니다.

  키움증권, 다우기술, 증권사 원장 담당자, 약 16개 여신사 및 수탁사 등 <mark>다양한 대외 기관과 협업</mark>하며 시스템 연계, 장애 대응 및 신규 서비스 도입을 수행했습니다. 이전에는 LG유플러스 관련 프로젝트에서 기간계 시스템 개발과 데이터 정합성 검증을 수행했습니다.

  개발 전 영향 범위와 예외 상황을 검토하고, 테스트 및 원복 시나리오를 준비하여 운영 환경에서 발생할 수 있는 위험을 최소화하고자 노력합니다.
  
  데이터의 <mark>정확성과 시스템 안정성</mark>을 중요하게 생각하며, 문제 발생 시 로그와 데이터 흐름을 분석해 근본 원인을 파악하고 처리 구조를 개선해 왔습니다.

